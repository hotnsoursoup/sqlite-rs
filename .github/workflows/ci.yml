name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Format
        run: cargo +stable fmt --all --check

      - name: Clippy
        run: cargo +stable clippy --all-features --all-targets -- -D warnings

      - name: Test default features
        run: cargo +stable test

      - name: Test all features
        run: cargo +stable test --all-features

      - name: Test no default features
        run: cargo +stable test --no-default-features

      - name: Documentation
        run: cargo +stable doc --all-features --no-deps

  msrv:
    name: MSRV 1.77
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSRV Rust
        run: rustup toolchain install 1.77.0 --profile minimal

      - name: Check library all features on MSRV
        run: cargo +1.77.0 check --lib --all-features

      - name: Test library all features on MSRV
        run: cargo +1.77.0 test --lib --all-features
